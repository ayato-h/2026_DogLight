<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Light - ホーム</title>
    <link rel="icon" href="http://127.0.0.1:5500/images/icon.png?v=10" type="image/png">
    <link rel="stylesheet" href="css/common.css">
</head>

<body>
    <div class="app-shell">
        <main id="main-content" class="screen screen--home">
            <section class="dog-section">
                <div class="dog-photo">
                    <img src="images/image.png" alt="なごみとるり">
                </div>
            </section>
            <section class="home-clock">
                <h1 id="current-time">05:00:00</h1>
                <p id="current-date"></p>
            </section>
            <section class="alarm-card">
                <div id="alarm-list">
                    <div class="alarm-info">
                        <div class="alarm-content">
                            <strong>05:00</strong>
                            <div class="voice-options">
                                <label>
                                    <input type="checkbox" checked>
                                    <span>るり</span>
                                </label>
                                <label>
                                    <input type="checkbox" checked>
                                    <span>なごみ</span>
                                </label>
                            </div>
                        </div>
                        <label class="alarm-toggle">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="alarm-info">
                        <div class="alarm-content">
                            <strong>05:30</strong>
                            <div class="voice-options">
                                <label>
                                    <input type="checkbox" checked>
                                    <span>るり</span>
                                </label>
                                <label>
                                    <input type="checkbox">
                                    <span>なごみ</span>
                                </label>
                            </div>
                        </div>
                        <label class="alarm-toggle">
                            <input type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <button type="button" id="add-alarm" class="alarm-add-button">＋</button>
            </section>

            <section class="home-menu">
                <!-- 思い出アルバム -->
                <a href="pages/album.html" class="menu-card menu-card--album">
                    <div class="menu-icon-wrap">
                        <span class="menu-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-journal-album" viewBox="0 0 16 16"><path d="M5.5 4a.5.5 0 0 0-.5.5v5a.5.5 0 0 0 .5.5h5a.5.5 0 0 0 .5-.5v-5a.5.5 0 0 0-.5-.5zm1 7a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1z" /><path d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2" /><path d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z" /></svg>
                        </span>
                        <span class="menu-decoration">♡</span>
                    </div>

                    <div class="menu-text">
                        <span class="menu-title">思い出アルバム</span>
                        <span class="menu-description">大切な日々を振り返る</span>
                    </div>

                    <span class="menu-arrow">↗</span>
                </a>
                <!-- ボイス -->
                <a href="pages/voice.html" class="menu-card menu-card--voice">
                    <div class="menu-icon-wrap">
                        <span class="menu-icon">♫</span>
                        <span class="menu-decoration">♪</span>
                    </div>

                    <div class="menu-text">
                        <span class="menu-title">ボイス</span>
                        <span class="menu-description">愛犬の声を聞く</span>
                    </div>

                    <span class="menu-arrow">↗</span>
                </a>
            </section>
        </main>
    </div>

    <script src="js/clock.js"></script>
    <script src="js/alarm-list.js"></script>

</body>

</html>
