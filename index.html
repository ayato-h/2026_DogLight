<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Light - ホーム</title>
    <link rel="icon" href="http://127.0.0.1:5500/images/icon.png?v=10" type="image/png">
    <link rel="stylesheet" href="css/common.css">
</head>

<body>
    <div class="app-shell">
        <main id="main-content" class="screen screen--home">
            <header class="home-header">
                <div class="logo">
                    <span class="logo-icon">🐾</span>
                    <span>あの日の朝</span>
                </div>
                <a href="pages/settings.html" class="settings-button">⚙</a>
            </header>
            <section class="home-clock">
                <h1 id="current-time">05:00:00</h1>
                <p id="current-date"></p>
            </section>
            <section class="dog-section">
                <div class="dog-photo">
                    <img src="images/dog.png" alt="なごみとるり">
                </div>
            </section>
            <section class="alarm-card">
                <div class="alarm-heading">
                    <span>アラーム一覧</span>
                </div>
                <div id="alarm-list">
                    <div class="alarm-info">
                        <div class="alarm-content">
                            <strong>05:00</strong>
                            <div class="voice-options">
                                <label>
                                    <input type="checkbox" checked>
                                    <span>るり</span>
                                </label>
                                <label>
                                    <input type="checkbox" checked>
                                    <span>なごみ</span>
                                </label>
                            </div>
                        </div>
                        <label class="alarm-toggle">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="alarm-info">
                        <div class="alarm-content">
                            <strong>05:30</strong>
                            <div class="voice-options">
                                <label>
                                    <input type="checkbox" checked>
                                    <span>るり</span>
                                </label>
                                <label>
                                    <input type="checkbox">
                                    <span>なごみ</span>
                                </label>
                            </div>
                        </div>
                        <label class="alarm-toggle">
                            <input type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                <button type="button" id="add-alarm" class="alarm-add-button">＋</button>
            </section>

            <section class="home-menu">
                <a href="pages/album.html" class="menu-card">
                    <span class="menu-icon">♡</span>
                    <span class="menu-title">思い出アルバム</span>
                    <span class="menu-description">写真を見る</span>
                </a>
                <a href="pages/voice.html" class="menu-card">
                    <span class="menu-icon">♫</span>
                    <span class="menu-title">ボイス</span>
                    <span class="menu-description">愛犬の声を聞く</span>
                </a>
            </section>
            <footer class="home-footer">いつでも、あの日の朝に。</footer>
        </main>
    </div>

    <script src="js/clock.js"></script>
    <script src="js/alarm-list.js"></script>

</body>

</html>
