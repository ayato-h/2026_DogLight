<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Light - アルバム</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/album.css">
</head>

<body>
    <div class="app-shell">
        <main id="main-content" class="screen screen--home">
            <header class="home-header">
                <div class="logo">
                    <span class="logo-icon"><a href="../index.html">＜</a></span>
                    <span>アルバム</span>
                </div>
            </header>
            <section class="album-add-section">
                <label for="photo-input" class="album-add-button">
                    <span class="album-add-icon">＋</span>
                    <span>写真を追加</span>
                </label>
                <input type="file" id="photo-input" accept="image/*" multiple hidden>
            </section>

            <section class="album-list-section">
                <div class="album-heading">
                    <span>登録した写真</span>
                </div>
                <div class="album-list" id="album-list">
                    <article class="album-item">
                        <img src="../images/album/nagomi-01.jpg" alt="なごみの写真" class="album-photo">
                        <div class="album-description">
                            <span class="album-caption">
                                いとこと一緒にお散歩
                            </span>
                            <span class="album-dog-name">なごみ</span>
                        </div>
                        <button type="button" class="album-delete-button" aria-label="写真を削除">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4h8v2"></path>
                                <path d="M19 6l-1 14H6L5 6"></path>
                                <path d="M10 11v5M14 11v5"></path>
                            </svg>
                        </button>
                    </article>

                    <article class="album-item">
                        <img src="../images/album/nagomi-02.jpg" alt="なごみの写真" class="album-photo">
                        <div class="album-description">
                            <span class="album-caption">
                                初めてのお出かけの日
                            </span>
                            <span class="album-dog-name">なごみ</span>
                        </div>
                        <button type="button" class="album-delete-button" aria-label="写真を削除">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4h8v2"></path>
                                <path d="M19 6l-1 14H6L5 6"></path>
                                <path d="M10 11v5M14 11v5"></path>
                            </svg>
                        </button>
                    </article>

                    <article class="album-item">
                        <img src="../images/album/ruri-01.jpg" alt="るりの写真" class="album-photo">
                        <div class="album-description">
                            <span class="album-caption">
                                初めてのお出かけの日
                            </span>
                            <span class="album-dog-name">るり</span>
                        </div>
                        <button type="button" class="album-delete-button" aria-label="写真を削除">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor"
                                stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"></path>
                                <path d="M8 6V4h8v2"></path>
                                <path d="M19 6l-1 14H6L5 6"></path>
                                <path d="M10 11v5M14 11v5"></path>
                            </svg>
                        </button>
                    </article>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
