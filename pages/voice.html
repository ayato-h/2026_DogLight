<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Light - 音声</title>
    <link rel="icon" href="images/icon.png" type="image/png">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/voice.css">
</head>

<body>
    <div class="app-shell">
        <main id="main-content" class="screen screen--home">
            <header class="home-header">
                <div class="logo">
                    <span class="logo-icon"><a href="../index.html">＜</a></span>
                    <span>音声</span>
                </div>
            </header>

            <section class="voice-list">

                <!-- るりの音声 -->
                <div class="voice-card">
                    <button type="button" class="voice-play" aria-label="るりの音声を再生">
                        ▶
                    </button>

                    <div class="voice-content">
                        <strong>るり</strong>
                        <div class="voice-wave" aria-label="音声の波形">
                            <span style="--h: 15px"></span>
                            <span style="--h: 25px"></span>
                            <span style="--h: 18px"></span>
                            <span style="--h: 32px"></span>
                            <span style="--h: 22px"></span>
                            <span style="--h: 12px"></span>
                            <span style="--h: 28px"></span>
                            <span style="--h: 20px"></span>
                            <span style="--h: 34px"></span>
                            <span style="--h: 16px"></span>
                            <span style="--h: 25px"></span>
                            <span style="--h: 13px"></span>
                            <span style="--h: 30px"></span>
                            <span style="--h: 19px"></span>
                        </div>
                    </div>
                </div>

                <!-- なごみの音声 -->
                <div class="voice-card">
                    <button type="button" class="voice-play" aria-label="なごみの音声を再生">
                        ▶
                    </button>

                    <div class="voice-content">
                        <strong>なごみ</strong>
                        <div class="voice-wave" aria-label="音声の波形">
                            <span style="--h: 20px"></span>
                            <span style="--h: 30px"></span>
                            <span style="--h: 14px"></span>
                            <span style="--h: 25px"></span>
                            <span style="--h: 35px"></span>
                            <span style="--h: 18px"></span>
                            <span style="--h: 27px"></span>
                            <span style="--h: 12px"></span>
                            <span style="--h: 23px"></span>
                            <span style="--h: 32px"></span>
                            <span style="--h: 16px"></span>
                            <span style="--h: 26px"></span>
                            <span style="--h: 14px"></span>
                            <span style="--h: 30px"></span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>
